{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet" />
    <link href="{% static 'Images/bmwlogo2.png' %}" rel="icon" />
    {% block CSS %}{% endblock %}
    <!-- {% block Javascript %}{% endblock %} -->
    <title>BMW - {% block title %}{% endblock %}</title>
</head>
<body>
    <!--<header>-->
    <div class="row">
        <div class="col-sm-12">
            <h1>Header</h1>
            <div>
                <a href="{% url 'home' %}">Home</a> |            
                <a href="{% url 'login' %}">Login</a> |
                <a href="{% url 'register' %}">Register</a> |
                <a href="{% url 'about' %}">About</a> |
                <a href="{% url 'contact' %}">Contact</a>
            </div>
        </div>
    </div>
    <!--</header>-->
    <hr/>
    <!--<Content>-->
    <div class="row">
        <div class="col-sm-12">
            {% block content %}
            {% endblock %}
        </div>
    </div>
    <!--</Content>-->
    <hr/>
    <!--<Footer>-->
    <div class="row">
        <div class="col-sm-12">
            <h1>Footer</h1>
        </div>
    </div>
    <!--</Footer>-->
</body>
</html>
